name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-electron:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/electron/package-lock.json
            packages/*/package-lock.json

      - name: Install and build workspace packages
        run: |
          PKGS="ai-providers audio-capture calendar-sync connectors connectors-slack database jensen-protocol knowledge-graph storage-controller transcription"
          for n in $PKGS; do
            (cd "packages/$n" && npm ci --ignore-scripts)
          done
          (cd packages/database && npm rebuild better-sqlite3)
          for n in $PKGS; do
            (cd "packages/$n" && npm run build --if-present)
          done

      - name: Install Electron app dependencies
        working-directory: ./apps/electron
        run: npm ci

      - name: Restore Node-ABI better-sqlite3 for validation
        working-directory: ./packages/database
        run: npm rebuild better-sqlite3

      - name: Typecheck
        working-directory: ./apps/electron
        run: npm run typecheck

      - name: Lint
        working-directory: ./apps/electron
        run: npm run lint

      - name: Test
        working-directory: ./apps/electron
        run: npm run test:run

      - name: Build Windows installer
        working-directory: ./apps/electron
        run: npm run build:win

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hidock-meeting-intelligence-windows
          path: apps/electron/dist/*
          if-no-files-found: error

  release:
    needs: build-electron
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: hidock-meeting-intelligence-windows
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
